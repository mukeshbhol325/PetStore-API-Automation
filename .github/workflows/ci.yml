name: Build, Test, Push to Docker Hub and Run on EC2

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: docker-ec2-deploy
  cancel-in-progress: true

env:
  IMAGE_NAME: petstore-api-automation

jobs:
  # Job 1: run the Maven tests on the GitHub runner (fast fail)
  maven-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Java and Maven
        run: |
          java -version
          mvn -version

      - name: Run Maven tests
        run: mvn -B clean test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-test-reports
          path: |
            target/surefire-reports/
            test-output/
            reports/
          if-no-files-found: ignore

  # Job 2: build the Docker image and push it to Docker Hub
  build-and-push:
    needs: maven-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Job 3: connect to EC2, install Docker, pull the image and run the tests
  run-on-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Install Docker, pull image and run tests on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            # Install Docker if it is missing (Amazon Linux)
            if ! command -v docker >/dev/null 2>&1; then
              sudo dnf install -y docker
              sudo systemctl enable --now docker
            fi

            IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

            # Pull the latest image from Docker Hub
            sudo docker pull $IMAGE

            # Run thte tests; mount folders so reports stay on the EC2 host
            mkdir -p ~/petstore-results/target ~/petstore-results/reports
            sudo docker run --rm \
              -v ~/petstore-results/target:/app/target \
              -v ~/petstore-results/reports:/app/reports \
              $IMAGE

            # Clean up old unused images to save disk space
            sudo docker image prune -f
